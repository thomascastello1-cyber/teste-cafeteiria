<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café do Bairro</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="cabecalho">
        <h1>Café do Bairro</h1>
        <p>Seu lugar favorito para começar o dia.</p>
    </header>

    <main>
        <section class="menu" id="menu">
            <h2>Nosso menu</h2>

            <article class="produto">
                <h3>Café expresso</h3>
                <p>Intenso e aromático.</p>
                <strong>R$ 6,00</strong>
            </article>

            <article class="produto">
                <h3>Cappuccino</h3>
                <p>Café com leite cremoso.</p>
                <strong>R$ 10,00</strong>
            </article>

            <article class="produto">
                <h3>Pão na chapa</h3>
                <p>Quente e crocante.</p>
                <strong>R$ 8,00</strong>
            </article>
        </section>

        <section class="contato">
            <h2>Venha nos visitar</h2>
            <button id="botao-contato" type="button">Mostrar contato</button>
            <p id="informacao-contato" aria-live="polite"></p>
        </section>
    </main>

</body>

</html>
